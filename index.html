<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ryan English 搭子 · 小朋友的英语学习伙伴</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/baloo-2@1.0.4/fonts/baloo2.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/baloo-2/1.0.4/fonts/baloo2.css" rel="stylesheet">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{
  --green:#2E9E5B; --green-d:#1F7A44; --green-2:#58C98A; --green-bg:#E6F5EC;
  --sun:#FFC145; --sun-d:#E6A32E; --sun-bg:#FFF6E0;
  --coral:#FF7A59; --coral-d:#E85C3A; --coral-bg:#FFEDE8;
  --blue:#3F8FDD; --blue-bg:#E8F2FC;
  --ink:#1D3527; --ink-2:#5B7568; --line:#D9E9DF;
  --card:#FFFFFF; --page:#F1F8F3;
  --r-sm:14px; --r-md:20px; --r-lg:26px;
  --sh-card:0 6px 18px rgba(31,122,68,.09);
  --sh-btn:0 5px 0 rgba(0,0,0,.16);
}
*{margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{font-size:17px; scroll-behavior:smooth}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--page); color:var(--ink);
  line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased;
}
.en{font-family:"Baloo 2","Comic Sans MS","Segoe Print","Noto Sans SC",sans-serif}
svg{display:block}
button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit}
input,select,textarea{font-family:inherit; font-size:1rem; color:var(--ink)}
img{max-width:100%}
.hidden{display:none!important}

/* ============ 顶部栏 ============ */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:10px 16px; background:#fff; border-bottom:2px solid var(--green-bg);
}
.logo{display:flex; align-items:center; gap:8px; cursor:pointer; flex:none}
.logo-mark{
  width:38px; height:38px; border-radius:12px; flex:none;
  background:linear-gradient(135deg,#2E9E5B,#58C98A); color:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 8px rgba(46,158,91,.35);
}
.logo-mark svg{width:22px; height:22px}
.logo-t{font-size:1.15rem; font-weight:900; color:var(--green-d); line-height:1.1}
.logo-t small{display:block; font-size:.62rem; font-weight:700; color:var(--ink-2); letter-spacing:.5px; margin-top:3px}
.top-right{margin-left:auto; display:flex; align-items:center; gap:8px}
.top-chip{
  display:flex; align-items:center; gap:6px; background:var(--sun-bg);
  border-radius:999px; padding:6px 12px; font-weight:900; font-size:.95rem; color:#8A5B00;
}
.top-chip svg{width:18px; height:18px; color:var(--sun-d)}
.icon-btn{
  width:40px; height:40px; border-radius:12px; background:var(--green-bg); color:var(--green-d);
  display:flex; align-items:center; justify-content:center; transition:transform .1s;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px; height:20px}

/* ============ 主内容 ============ */
main{max-width:1000px; margin:0 auto; padding:10px 18px 130px}
.card{
  background:var(--card); border-radius:var(--r-lg); padding:22px 22px;
  box-shadow:var(--sh-card); border:1px solid var(--line);
}
.card+.card{margin-top:16px}
.card-title{display:flex; align-items:center; gap:8px; font-size:1.2rem; font-weight:900; color:var(--ink); margin-bottom:14px}
.card-title svg{width:24px; height:24px; color:var(--green)}
.view-head{margin:6px 4px 16px}
.view-title{font-size:2rem; font-weight:900; color:var(--green-d); line-height:1.2}
.view-sub{font-size:1rem; color:var(--ink-2); margin-top:4px}

/* ============ Hero 首页 ============ */
.hero{
  border-radius:28px; padding:30px 28px; position:relative; overflow:hidden; color:#fff;
  background:linear-gradient(135deg,#1F7A44 0%, #2E9E5B 55%, #4FC98A 100%);
  box-shadow:0 12px 28px rgba(31,122,68,.32);
}
.hero::after{
  content:""; position:absolute; right:-70px; top:-70px; width:230px; height:230px;
  background:rgba(255,255,255,.10); border-radius:50%;
}
.hero .badge{
  display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.28); border-radius:999px;
  padding:6px 14px; font-size:.95rem; font-weight:700;
}
.hero .badge svg{width:16px; height:16px}
.hero h1{font-size:2.5rem; font-weight:900; line-height:1.2; margin:14px 0 8px}
.hero p{font-size:1.05rem; opacity:.95; max-width:560px}
.hero .steps{
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:22px; position:relative; z-index:1;
}
.hero .step{
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.24);
  border-radius:18px; padding:14px 10px; text-align:center;
}
.hero .step .n{
  width:32px; height:32px; border-radius:11px; background:#fff; color:var(--green-d);
  font-weight:900; display:flex; align-items:center; justify-content:center; margin:0 auto 8px; font-size:1rem;
}
.hero .step .t{font-size:.95rem; font-weight:900}
.hero .step .d{font-size:.82rem; opacity:.92; margin-top:2px}

/* ============ 统计 ============ */
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:16px}
.stat-card{
  background:var(--card); border-radius:var(--r-lg); padding:18px 14px;
  box-shadow:var(--sh-card); text-align:center; border:1px solid var(--line);
}
.stat-card .num{font-size:2rem; font-weight:900; line-height:1.1; color:var(--green-d)}
.stat-card .lab{font-size:.9rem; color:var(--ink-2); font-weight:700; margin-top:2px}
.stat-card .ic{width:30px; height:30px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center}
.stat-card .ic svg{width:28px; height:28px}

/* ============ 快捷入口 ============ */
.quick-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px}
.quick{
  border-radius:22px; padding:20px; text-align:left; color:#fff;
  box-shadow:var(--sh-btn); transform:translateY(-2px); position:relative; overflow:hidden;
  transition:transform .12s;
}
.quick:active{transform:translateY(2px); box-shadow:none}
.quick .q-t{font-size:1.2rem; font-weight:900; display:flex; align-items:center; gap:8px}
.quick .q-t svg{width:24px; height:24px}
.quick .q-d{font-size:.95rem; opacity:.94; margin-top:4px}
.quick .q-ic{position:absolute; right:12px; bottom:8px; width:64px; height:64px; opacity:.22}
.quick .q-ic svg{width:100%; height:100%}
.q-green{background:linear-gradient(135deg,#2E9E5B,#58C98A)}
.q-dark{background:linear-gradient(135deg,#1F7A44,#2E9E5B)}
.q-sun{background:linear-gradient(135deg,#FFC145,#FF9A3D)}
.q-coral{background:linear-gradient(135deg,#FF7A59,#FF9A70)}
.q-blue{background:linear-gradient(135deg,#3F8FDD,#6FB5F0)}

/* ============ 工作流 ============ */
.workflow{margin-top:16px}
.flow-item{display:flex; gap:16px; padding:18px 0; border-bottom:1px dashed var(--line)}
.flow-item:last-child{border-bottom:none}
.flow-item .f-n{
  flex:none; width:42px; height:42px; border-radius:14px;
  background:var(--green-bg); color:var(--green-d); font-weight:900; font-size:1.1rem;
  display:flex; align-items:center; justify-content:center;
}
.flow-item .f-t{font-size:1.08rem; font-weight:900}
.flow-item .f-d{font-size:.95rem; color:var(--ink-2); margin-top:3px}

/* ============ 单元列表 ============ */
.unit-list{display:flex; flex-direction:column; gap:12px}
.unit-card{
  display:flex; align-items:center; gap:14px; background:var(--card);
  border:1px solid var(--line); border-radius:20px; padding:16px 18px;
  box-shadow:var(--sh-card); cursor:pointer; transition:transform .1s;
}
.unit-card:active{transform:scale(.985)}
.unit-stripe{flex:none; width:10px; align-self:stretch; border-radius:6px}
.unit-badge{
  flex:none; width:46px; height:46px; border-radius:15px; color:#fff; font-weight:900; font-size:1.15rem;
  display:flex; align-items:center; justify-content:center;
}
.unit-info{flex:1; min-width:0}
.unit-t{font-size:1.1rem; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.unit-s{font-size:.9rem; color:var(--ink-2); margin-top:2px}
.unit-arrow{flex:none; color:var(--ink-2)}
.unit-arrow svg{width:22px; height:22px}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-size:1.05rem; font-weight:900; min-height:54px; padding:12px 26px;
  border-radius:16px; box-shadow:var(--sh-btn); transform:translateY(-2px);
  transition:transform .1s, box-shadow .1s; text-decoration:none;
}
.btn:active{transform:translateY(2px); box-shadow:none}
.btn svg{width:24px; height:24px}
.btn.block{display:flex; width:100%}
.btn.sm{min-height:44px; padding:8px 18px; font-size:.95rem; border-radius:13px}
.btn.green{background:linear-gradient(135deg,#2E9E5B,#3FB873); color:#fff}
.btn.coral{background:linear-gradient(135deg,#FF7A59,#FF8F6B); color:#fff}
.btn.sun{background:linear-gradient(135deg,#FFC145,#FFB020); color:#6B4A00}
.btn.blue{background:linear-gradient(135deg,#3F8FDD,#5FA9EC); color:#fff}
.btn.ghost{background:#fff; color:var(--green-d); border:2px solid var(--green); box-shadow:none; transform:none}
.btn.ghost:active{transform:scale(.98)}
.btn[disabled]{opacity:.5; pointer-events:none}

/* ============ 徽章/标签 ============ */
.chip-row{display:flex; flex-wrap:wrap; gap:10px}
.chip{
  display:inline-flex; align-items:center; gap:6px; min-height:46px; padding:8px 16px;
  border-radius:14px; background:#F3F8F5; border:2px solid var(--line);
  font-size:1rem; font-weight:700; transition:all .12s;
}
.chip.on{background:var(--green-bg); border-color:var(--green); color:var(--green-d)}
.chip .ck{width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff}
.chip.on .ck{background:var(--green)}
.chip:not(.on) .ck{background:#CBDDD2}
.chip .ck svg{width:14px; height:14px}
.sec-lab{display:flex; align-items:center; gap:8px; font-size:1.05rem; font-weight:900; margin:18px 0 10px}
.sec-lab:first-child{margin-top:0}
.sec-lab svg{width:24px; height:24px; color:var(--green)}
.tip{font-size:.78rem; font-weight:700; color:var(--ink-2); background:#EEF5F0; padding:2px 10px; border-radius:999px}

/* 难度卡 */
.diff-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.diff-card{
  border-radius:18px; padding:18px 14px; text-align:center; cursor:pointer;
  background:var(--card); border:3px solid var(--line); transition:all .15s;
}
.diff-card:hover{border-color:var(--green)}
.diff-card.on{border-color:var(--green); background:var(--green-bg)}
.diff-card .d-n{font-size:1.5rem; font-weight:900; color:var(--green)}
.diff-card .d-l{font-size:1.05rem; font-weight:900; margin-top:2px}
.diff-card .d-s{font-size:.9rem; color:var(--ink-2); margin-top:4px}
.diff-card.sm{border-radius:14px; padding:8px 6px; border-width:2px}
.diff-card.sm .d-n{font-size:1rem}
.diff-card.sm .d-l{font-size:.9rem; margin-top:0}
.diff-card.sm .d-s{font-size:.78rem; margin-top:2px}
.chip.sm{min-height:38px; padding:6px 10px; border-radius:11px; font-size:.9rem}
.chip.sm .ck{width:18px; height:18px}
.chip.sm .ck svg{width:12px; height:12px}

/* 考核方式卡 */
.opt-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.opt-card{
  display:flex; align-items:center; gap:12px; border-radius:18px; padding:16px;
  background:var(--card); border:3px solid var(--line); cursor:pointer; transition:all .15s;
}
.opt-card:hover{border-color:var(--green)}
.opt-card.on{border-color:var(--green); background:var(--green-bg)}
.opt-card .o-ic{flex:none; width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff}
.opt-card .o-ic svg{width:26px; height:26px}
.opt-card .o-l{font-size:1.1rem; font-weight:900}
.opt-card .o-s{font-size:.88rem; color:var(--ink-2)}
.type-row{display:flex; gap:12px; flex-wrap:wrap}

/* 规则提示 */
.rule-note{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--sun-bg); border-radius:18px; padding:16px;
  font-size:1rem; color:#7A5410; margin-top:16px; border:1px solid #F3DCA0;
}
.rule-note svg{flex:none; margin-top:2px; width:22px; height:22px}

/* ============ 课程详情 ============ */
.dlg-title{display:flex; align-items:center; gap:8px; font-size:1.15rem; font-weight:900; margin:18px 0 10px; color:var(--green-d)}
.dlg-title svg{width:24px; height:24px}
.dlg-card{
  background:#F7FBF8; border:1px solid var(--line); border-radius:16px;
  padding:10px 14px; margin-bottom:8px;
}
.dlg-head{display:flex; align-items:center; gap:8px}
.dlg-head .who{
  font-weight:900; font-size:.9rem; color:var(--green-d); background:var(--green-bg);
  border-radius:10px; padding:3px 10px; text-align:center;
}
.dlg-acts{margin-left:auto; display:flex; gap:6px}
.dlg-en{font-size:1.15rem; font-weight:700; margin-top:8px}
.dlg-ipa{font-size:.95rem; color:var(--ink-2); margin-top:3px}
.dlg-zh{font-size:.95rem; color:var(--ink-2); margin-top:3px}
.mini-btn{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:var(--green-bg); color:var(--green-d); transition:transform .1s}
.mini-btn:active{transform:scale(.9)}
.mini-btn svg{width:22px; height:22px}
.mini-btn.coral{background:var(--coral-bg); color:var(--coral-d)}
.mini-btn{
  width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  background:var(--green-bg); color:var(--green-d); transition:transform .1s;
}
.mini-btn:active{transform:scale(.9)}
.mini-btn svg{width:22px; height:22px}
.mini-btn.coral{background:var(--coral-bg); color:var(--coral-d)}

/* 单词行 */
.w-row{
  display:flex; align-items:center; gap:12px; padding:12px 8px;
  border-bottom:1px dashed var(--line); flex-wrap:wrap;
}
.w-row:last-child{border-bottom:none}
.w-en{font-size:1.35rem; font-weight:900}
.w-ipa{font-size:1.15rem; color:var(--ink-2); font-family:inherit}
.w-zh{font-size:1rem; color:var(--ink-2); margin-left:auto}
.w-acts{display:flex; gap:6px}

/* ============ 音标母音红色 ============ */
.ipa-v{color:#E0352F; font-weight:900}

/* ============ 空状态 ============ */
.empty{text-align:center; padding:46px 20px}
.empty .e-ic{width:90px; height:90px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; color:var(--green); opacity:.35}
.empty .e-ic svg{width:100%; height:100%}
.empty .e-t{font-size:1.2rem; font-weight:900}
.empty .e-d{font-size:.95rem; color:var(--ink-2); margin:6px 0 18px}

/* ============ 底部导航 ============ */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  display:flex; background:#fff; border-top:2px solid var(--green-bg);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 18px rgba(31,122,68,.08);
}
.tabbar.hidden{display:none}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:8px 4px; border-radius:14px; color:#8AA69A; font-size:.82rem; font-weight:700;
}
.tab svg{width:26px; height:26px}
.tab.on{color:var(--green-d); background:var(--green-bg)}
.tab .tab-pill{position:relative}
.wb-badge{
  position:absolute; top:-6px; right:-10px; min-width:20px; height:20px; padding:0 5px;
  border-radius:999px; background:var(--coral); color:#fff; font-size:.72rem; font-weight:900;
  display:flex; align-items:center; justify-content:center;
}
.wb-badge.hidden{display:none}

/* ============ 考试进行 ============ */
.quiz-shell{
  position:fixed; inset:0; z-index:60; background:var(--page); overflow-y:auto;
  padding:14px 16px 120px;
}
.quiz-head{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.quiz-head .q-stars{display:flex; gap:4px; margin-left:auto}
.quiz-head .q-stars svg{width:30px; height:30px; color:#D8E4DD}
.quiz-head .q-stars svg.lit{color:var(--sun)}
.q-tags{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap}
.q-tag{font-size:.85rem; font-weight:900; padding:5px 12px; border-radius:999px}
.q-tag.sun{background:var(--sun-bg); color:#8A5B00}
.q-tag.green{background:var(--green-bg); color:var(--green-d)}
.q-tag.coral{background:var(--coral-bg); color:var(--coral-d)}
.q-card{background:#fff; border-radius:26px; padding:28px 24px; box-shadow:var(--sh-card); border:1px solid var(--line)}
.big-en{font-size:2.9rem; font-weight:900; text-align:center; line-height:1.15; word-break:break-word}
.big-zh{font-size:2.2rem; font-weight:900; text-align:center; line-height:1.3}
.ipa{font-size:1.5rem; text-align:center; color:var(--ink-2); margin-top:6px}
.hint{text-align:center; font-size:1rem; color:var(--ink-2); margin-top:10px}
.opt-list{display:flex; flex-direction:column; gap:12px; margin-top:22px}
.opt-btn{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  background:#F7FBF8; border:2px solid var(--line); border-radius:18px;
  padding:16px 18px; font-size:1.2rem; font-weight:800; transition:all .12s;
}
.opt-btn:active{transform:scale(.99)}
.opt-btn .k{
  flex:none; width:36px; height:36px; border-radius:11px; background:#E4EEE8;
  display:flex; align-items:center; justify-content:center; font-size:1rem; font-weight:900; color:var(--green-d);
}
.opt-btn.ok{border-color:var(--green); background:var(--green-bg)}
.opt-btn.bad{border-color:var(--coral); background:var(--coral-bg)}
.opt-btn.dim{opacity:.55}
.opt-btn.ok .k{background:var(--green); color:#fff}
.opt-btn.bad .k{background:var(--coral); color:#fff}
.type-box{margin-top:22px}
.type-input{
  width:100%; min-height:64px; border-radius:18px; border:3px solid var(--line);
  padding:12px 18px; font-size:1.4rem; font-weight:800; text-align:center; outline:none;
  background:#FBFDFC; transition:border-color .12s;
}
.type-input:focus{border-color:var(--green)}
.type-input.correct{border-color:var(--green); background:var(--green-bg)}
.type-input.wrong{border-color:var(--coral); background:var(--coral-bg)}
.fill-box{margin-top:18px; text-align:center}
.fill-en{font-size:1.9rem; font-weight:900; letter-spacing:.06em; line-height:1.4}
.fill-en .gap{color:var(--green-d); background:var(--green-bg); border-radius:10px; padding:0 8px}
.blank-card{
  background:#F7FBF8; border:2px dashed var(--green); border-radius:18px;
  padding:14px 18px; margin-top:14px; font-size:1.35rem; font-weight:800; text-align:center;
}
.mic-btn{
  width:120px; height:120px; border-radius:50%; margin:22px auto 8px;
  background:linear-gradient(135deg,#FF7A59,#FF9A70); color:#fff;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 0 var(--coral-d), 0 10px 22px rgba(255,122,89,.35);
  transition:transform .12s;
}
.mic-btn:active{transform:scale(.94)}
.mic-btn svg{width:56px; height:56px}
.mic-btn.listening{animation:pulse 1.2s infinite}
.mic-btn.green{background:linear-gradient(135deg,#2E9E5B,#58C98A); box-shadow:0 6px 0 var(--green-d), 0 10px 22px rgba(46,158,91,.35)}
@keyframes pulse{
  0%{box-shadow:0 6px 0 var(--coral-d), 0 0 0 0 rgba(255,122,89,.45)}
  70%{box-shadow:0 6px 0 var(--coral-d), 0 0 0 30px rgba(255,122,89,0)}
  100%{box-shadow:0 6px 0 var(--coral-d), 0 0 0 0 rgba(255,122,89,0)}
}
.mic-status{text-align:center; font-size:1rem; color:var(--ink-2); min-height:1.6em}

function autoIpa(en){
  const k = normWord(en);
  if (IPA_DICT[k]) return IPA_DICT[k];
  const ws = k.split(" ").map(w => IPA_DICT[w]).filter(Boolean);
  if (ws.length && ws.length === k.split(" ").length) return ws.join(" ");
  return "";
}
function autoLineIpa(en){
  const k = normWord(en);
  if (IPA_DICT[k]) return IPA_DICT[k];
  return k.split(" ").map(w => IPA_DICT[w]).filter(Boolean).join(" ");
}
/* 音标：母音（元音）标红 */
const IPA_VOWEL_RE = /(?:eɪ|aɪ|aʊ|ɔɪ|oʊ|əʊ|ɪə|eə|ʊə|iː|uː|ɑː|ɔː|ɜː|ɐː|æ|ɒ|ɔ|ʌ|ə|ɜ|ɪ|ʊ|i|e|u|o|ɑ|ɚ|ɝ|ɨ|ʉ|ɐ|ɘ|ɵ|ɤ|ø|œ|y|ː)/g;
function ipaVowelHtml(ipa){
  if (!ipa) return "";
  let s = String(ipa);
  const out = [];
  let last = 0;
  const re = new RegExp(IPA_VOWEL_RE.source, "g");
  let m;
  while ((m = re.exec(s)) !== null) {
    out.push(esc(s.slice(last, m.index)), `<span class="ipa-v">${esc(m[0])}</span>`);
    last = m.index + m[0].length;
  }
  out.push(esc(s.slice(last)));
  return out.join("");
}

/* ================= 解析器 ================= */
function matchUnitHeader(line){
  const m = line.match(/^(?:unit|第)(?:\s*([0-9一二三四五六七八九十]+)\s*[课单元篇]?)?\s*[:：\-—]?\s*(.+)$/i);
  if (m) return { n: m[1] || "", title: line.replace(/^(?:unit|第)(?:\s*[0-9一二三四五六七八九十]+\s*[课单元篇]?)?\s*[:：\-—]?\s*/i, "").trim() };
  return null;
}
function parseDialogueLine(line){
  const m = line.match(/^([^:：]{1,16}?)[:：]\s*(.+)$/);
  if (!m) return null;
  const who = m[1].trim();
  const rest = m[2].trim();
  const zm = rest.match(/^(.*?)\s+([\u4e00-\u9fa5].*)$/);
  const en = zm ? zm[1].trim() : rest;
  const zh = zm ? zm[2].trim() : "";
  if (!en) return null;
  const ipa = autoLineIpa(en);
  return { who, en, zh, ipa };
}
function parseWordLine(line){
  const m = line.match(/^([A-Za-z][A-Za-z'’ ()-]*?)\s+([\u4e00-\u9fa5].*)$/);
  if (!m) return null;
  const en = m[1].trim();
  const zh = m[2].trim();
  if (!en || !zh) return null;
  return { en, zh, ipa: autoIpa(en) };
}
function parseCourseText(rawText, title){
  const lines = String(rawText || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const units = [];
  let cur = null, section = "words";
  const mkUnit = t => ({ id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: t, zh: "", words: [], dialogues: [] });
  for (const line of lines) {
    const uh = matchUnitHeader(line);
    if (uh) { cur = mkUnit(uh.title || ("Unit " + uh.n)); units.push(cur); section = "words"; continue; }
    if (/^(对话|dialogue|conversation|情景对话|角色扮演|let's talk|let’s talk|lets talk|role play|talk)/i.test(line)) {
      section = "dialogue";
      if (!cur) { cur = mkUnit(units.length ? "补充单元" : "未命名单元"); units.push(cur); }
      const t = line.replace(/^(对话|dialogue|conversation|情景对话|角色扮演|let's talk|let’s talk|lets talk|role play|talk)[:：\-—]?\s*/i, "").trim();
      cur.dialogues.push({ id: "d" + cur.dialogues.length, title: t || "对话", zh: "", lines: [] });
      continue;
    }
    if (!cur) { cur = mkUnit(units.length ? "补充单元" : "未命名单元"); units.push(cur); }
    if (section === "dialogue") {
      const dl = parseDialogueLine(line);
      if (dl) {
        if (!cur.dialogues.length) cur.dialogues.push({ id: "d" + cur.dialogues.length, title: "对话", zh: "", lines: [] });
        cur.dialogues[cur.dialogues.length - 1].lines.push(dl);
        continue;
      }
    }
    const w = parseWordLine(line);
    if (w) {
      if (!w.ipa) w.ipa = autoIpa(w.en);
      w.phrase = w.en.includes(" ") ? true : undefined;
      cur.words.push(w);
    }
  }
  units.forEach(u => u.dialogues.forEach(d => { if (!d.lines) d.lines = []; }));
  return units.filter(u => u.words.length || u.dialogues.length);
}

const LS_KEY = "ryan-state-v1";
const defaultState = () => ({ course: null, mastery: {}, stars: 0, exams: 0, totalQ: 0, correctQ: 0, extras: [], speakLog: [], examLog: [] });
let S = defaultState();
function saveState(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }
function loadState(){
  try {
    const raw = localStorage.getItem(LS_KEY);

  } catch(e) {}
}
function resetAll(){
  S = defaultState(); saveState();

}
function getMastery(id){ return S.mastery[id] || { consecutive: 0, wrongCount: 0, status: "new", lastWrongAt: 0, lastOkAt: 0, history: [] }; }
function recordResult(item, ok){
  const m = getMastery(item._id);
  m.history = (m.history || []).slice(-60);
  m.history.push({ ok, t: Date.now() });
  if (ok) {
    m.consecutive = (m.consecutive || 0) + 1;
    m.lastOkAt = Date.now();
    if (m.consecutive >= 3) m.status = "mastered";
    else if (m.status === "new") m.status = "learning";
  } else {
    m.consecutive = 0;
    m.wrongCount = (m.wrongCount || 0) + 1;
    m.status = "learning";
    m.lastWrongAt = Date.now();
  }
  S.mastery[item._id] = m;
  if (ok) S.stars += 1;
  S.totalQ += 1; S.correctQ += ok ? 1 : 0;
  saveState();
  return m;
}
function collectItems(unit){
  const items = [];
  unit.words.forEach((w, i) => items.push(Object.assign({}, w, { _id: unit.id + "::w" + i, _unitId: unit.id, _unitTitle: unit.title, _kind: w.phrase ? "phrase" : "word" })));
  unit.dialogues.forEach(d => d.lines.forEach((l, i) => {
    items.push({ en: l.en, zh: l.zh, ipa: l.ipa || "", _id: unit.id + "::d" + d.id + "::" + i, _unitId: unit.id, _unitTitle: unit.title, _kind: "dialogue", _who: l.who, _dlgTitle: d.title });
  }));
  return items;
}
function allItems(){
  if (!S.course) return [];
  const base = S.course.units.flatMap(collectItems);
  const ex = (S.extras || []).map(e => Object.assign({}, e, { _kind: e.phrase ? "phrase" : "word", _unitId: null, _unitTitle: "拍照/手记错题" }));
  return base.concat(ex);
}
function wrongItems(){
  return allItems().filter(it => getMastery(it._id).wrongCount > 0)
    .sort((a, b) => getMastery(b._id).lastWrongAt - getMastery(a._id).lastWrongAt);
}
function unitProgress(unit){
  const items = collectItems(unit);
  return { total: items.length, mastered: items.filter(it => getMastery(it._id).status === "mastered").length };
}
function courseStats(){
  const items = allItems();
  return {
    total: items.length,
    mastered: items.filter(it => getMastery(it._id).status === "mastered").length,
    learning: items.filter(it => getMastery(it._id).status === "learning").length,
    wrong: wrongItems().filter(it => getMastery(it._id).status !== "mastered").length
  };
}
function wrongGroups(){
  const ws = wrongItems();
  return {
    active: ws.filter(it => getMastery(it._id).status !== "mastered"),
    near: ws.filter(it => getMastery(it._id).status !== "mastered" && getMastery(it._id).consecutive >= 2),
    mastered: ws.filter(it => getMastery(it._id).status === "mastered")
  };
}

/* ================= 语音：朗读 + 口说识别 ================= */
function speak(text, lang){
  if (!("speechSynthesis" in window)) { toast("当前浏览器不支持语音朗读"); return; }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "en-US";
    u.rate = 0.82; u.pitch = 1.05; u.volume = 1;
    const vs = window.speechSynthesis.getVoices();
    const v = vs.find(x => x.lang && x.lang.toLowerCase().startsWith((lang || "en-US").slice(0, 2).toLowerCase()));
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch(e) { toast("朗读失败，请重试"); }
}
function speakEn(t){ speak(t, "en-US"); }
function speakZh(t){ speak(t, "zh-CN"); }
let asr = null;
function asrSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function stopAsr(){ if (asr) { try { asr.onresult = null; asr.onerror = null; asr.onend = null; asr.stop(); } catch(e){} asr = null; } }
function startAsr(onResult, onEnd){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return false;
  stopAsr();
  const r = new SR();
  r.lang = "en-US"; r.interimResults = true; r.maxAlternatives = 3; r.continuous = true;
  let final = "", confs = [];
  r.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      const c = e.results[i][0].confidence || 0;
      if (e.results[i].isFinal) { final += t + " "; confs.push(c); } 
    }
    const cur = Array.from(e.results).slice(-1)[0];
    const interim = !cur[0].isFinal ? cur[0].transcript : "";
    onResult({ final: final.trim(), interim: interim.trim(), conf: confs.length ? confs.reduce((a, b) => a + b, 0) / confs.length : (cur[0].confidence || 0) });
  };
  r.onerror = e => { onEnd && onEnd(false, e.error || "error"); };
  r.onend = () => { if (onEnd) onEnd(true); };
  asr = r;
  try { r.start(); return true; } catch(e) { return false; }
}

/* ================= 跟读发音评分 ================= */
function levenshtein(a, b){
  a = String(a || ""); b = String(b || "");
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return dp[a.length][b.length];
}
function similarity(target, hyp){
  const expand = s => normWord(s)
    .replace(/'m\b/g, " am").replace(/'re\b/g, " are").replace(/'s\b/g, " is")
    .replace(/n't\b/g, " not").replace(/'ve\b/g, " have").replace(/'ll\b/g, " will");
  const t = expand(target), h = expand(hyp);
  if (!t || !h) return 0;
  const tw = t.split(" "), hw = h.split(" ");
  if (tw.length > 1) {
    let hit = 0;
    for (const w of hw) if (tw.includes(w)) hit++;
    const order = hit > 1 ? 1 : 0;
    return (hit / tw.length) * 0.85 + order * 0.1 + (h === t ? 0.05 : 0);
  }
  return 1 - levenshtein(t, h) / Math.max(t.length, h.length, 1);
}
function rateSpeak(target, hyp, conf){
  const sim = similarity(target, hyp);
  let score;
  if (conf === undefined || conf === null) score = Math.max(0, Math.min(100, Math.round(sim * 100)));
  else score = Math.max(0, Math.min(100, Math.round(sim * 76 + Math.max(0, Math.min(1, conf)) * 24)));
  let stars = 1, msg;
  if (score >= 90) { stars = 3; msg = "太棒了！发音非常标准！"; }
  else if (score >= 80) { stars = 3; msg = "非常好！继续加油！"; }
  else if (score >= 70) { stars = 2; msg = "很好！再读一遍会更棒！"; }
  else if (score >= 55) { stars = 2; msg = "不错哦，放慢一点再试试！"; }
  else if (score >= 40) { stars = 1; msg = "继续加油，先听一遍示范！"; }
  else { stars = 1; msg = "再听一遍，跟着大声读出来！"; }
  return { score, stars, msg, sim, conf: conf === undefined || conf === null ? null : Math.max(0, Math.min(1, conf)) };
}

/* ================= Whisper 离线识别引擎 ================= */
let whisperPipe = null, whisperReady = false, whisperLoading = false, whisperErr = null;
const WHISPER_CDN = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2/dist/transformers.min.js";
const WHISPER_MODEL = "Xenova/whisper-base.en";
const WHISPER_MIRROR = "https://hf-mirror.com";
async function loadWhisper(onProgress){
  if (whisperPipe) return whisperPipe;
  if (whisperLoading) return null;
  whisperLoading = true;
  try {
    const mod = await import(WHISPER_CDN);
    if (mod && mod.env) {
      mod.env.allowLocalModels = false;
      mod.env.remoteHost = WHISPER_MIRROR;
    }
    whisperPipe = await mod.pipeline("automatic-speech-recognition", WHISPER_MODEL, {
      quantized: true,
      progress_callback: p => { if (onProgress && p && p.status === "progress" && p.total) onProgress(p.loaded, p.total); }
    });
    whisperReady = true;
    return whisperPipe;
  } catch(e) {
    whisperErr = String((e && e.message) || e);
    return null;
  } finally { whisperLoading = false; }
}
function trimSilence(data, sr){
  const n = data.length;
  if (n < sr) return data;
  const win = Math.floor(sr * 0.02), th = 0.004;
  let start = 0, end = n - 1;
  for (let i = 0; i + win < n; i += win) {
    let e = 0; for (let j = i; j < i + win; j++) e += data[j] * data[j];
    if (Math.sqrt(e / win) > th) { start = i; break; }
  }
  for (let i = n - win; i >= 0; i -= win) {
    let e = 0; for (let j = i; j < i + win; j++) e += data[j] * data[j];
    if (Math.sqrt(e / win) > th) { end = i + win; break; }
  }
  if (end <= start) return data;
  start = Math.max(0, start - Math.floor(sr * 0.1));
  end = Math.min(n, end + Math.floor(sr * 0.1));
  return data.slice(start, end);
}
function normalizeAudio(data){
  let peak = 0;
  for (let i = 0; i < data.length; i++) { const a = Math.abs(data[i]); if (a > peak) peak = a; }
  if (peak < 0.002) return data;
  const gain = Math.min(5, 0.3 / peak);
  if (gain > 0.9 && gain < 1.1) return data;
  const out = new Float32Array(data.length);
  for (let i = 0; i < data.length; i++) out[i] = data[i] * gain;
  return out;
}
async function whisperToText(pcm){
  const pipe = whisperPipe;
  if (!pipe) return "";
  try {
    if (!pcm || !pcm.data || !pcm.data.length) return "";
    const sr = pcm.sampleRate || 48000;
    let data = pcm.data;
    if (sr !== 16000) {  // 显式重采样到 16k，避免引擎内部重采样不确定
      const out = new Float32Array(Math.round(data.length * 16000 / sr));
      const ratio = sr / 16000;
      for (let i = 0; i < out.length; i++) {
        const pos = i * ratio;
        const i0 = Math.floor(pos), i1 = Math.min(i0 + 1, data.length - 1);
        const frac = pos - i0;
        out[i] = data[i0] * (1 - frac) + data[i1] * frac;
      }
      data = out;
    }
    data = trimSilence(data, 16000);
    data = normalizeAudio(data);
    const out = await pipe(data, { max_new_tokens: 80 });  // .en 模型禁止传 language/task
    return String((out && out.text) || "").trim();
  } catch(e) { whisperErr = String((e && e.message) || e); try { console.error("[Whisper]", e); } catch(_){} return ""; }
}
let recStream = null, pcmCtx = null, pcmSrc = null, pcmProc = null, pcmChunks = [], recordStopCb = null;
function stopRecord(){
  if (recordStopCb) { const cb = recordStopCb; recordStopCb = null; cb(); }
  else if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
}
function recordOnce(maxSec){
  return new Promise((resolve, reject) => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { reject(new Error("no-mic")); return; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(async stream => {
      recStream = stream;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        pcmCtx = ctx;
        if (ctx.state === "suspended") { try { await ctx.resume(); } catch(e){} }
        pcmChunks = [];
        pcmSrc = ctx.createMediaStreamSource(stream);
        pcmProc = ctx.createScriptProcessor(4096, 1, 1);
        pcmProc.onaudioprocess = e => {
          const ch = e.inputBuffer.getChannelData(0);
          if (ch && ch.length) pcmChunks.push(new Float32Array(ch));
        };
        const mute = ctx.createGain(); mute.gain.value = 0;
        pcmSrc.connect(pcmProc);
        pcmProc.connect(mute);
        mute.connect(ctx.destination);
        let stopped = false;
        const finish = () => {
          if (stopped) return; stopped = true;
          recordStopCb = null;
          try { if (pcmProc) pcmProc.disconnect(); } catch(e){}
          try { if (pcmSrc) pcmSrc.disconnect(); } catch(e){}
          try { ctx.close(); } catch(e){}
          stream.getTracks().forEach(t => t.stop());
          recStream = null; pcmCtx = null; pcmSrc = null; pcmProc = null;
          let len = 0; for (const c of pcmChunks) len += c.length;
          const data = new Float32Array(len);
          let off = 0; for (const c of pcmChunks) { data.set(c, off); off += c.length; }
          pcmChunks = [];
          resolve({ data, sampleRate: ctx.sampleRate });
        };
        recordStopCb = finish;
        if (maxSec) setTimeout(() => { if (recordStopCb === finish) finish(); }, maxSec * 1000);
      } catch(e) {
        stream.getTracks().forEach(t => t.stop());
        recStream = null;
        reject(e);
      }
    }).catch(e => reject(e));
  });
}
function speakRecorderUI(host, target, onResult, opts){

        return;
      }
      status.textContent = "引擎就绪！";
    }
    try {
      busy = true;
      recording = true;
      btn.innerHTML = `${IC.mic} 停止（再点一下结束）`;
      status.textContent = "正在听…大声读出来！";
      const { data, sampleRate } = await recordOnce(15);
      recording = false;
      btn.disabled = true;
      btn.innerHTML = `${IC.sound} 识别中…`;
      status.textContent = "识别中…";
      const hyp = await whisperToText({ data, sampleRate });
      if (!hyp) {
        status.textContent = whisperErr ? "识别引擎出错，请刷新页面后重试" : "没有听清，请再大声读一次";
        resetBtn();
        busy = false;
        return;
      }
      const r = rateSpeak(target, hyp);
      if (onResult) onResult({ ok: r.score >= 70, hyp, score: r.score, stars: r.stars, msg: r.msg });
      resetBtn();
      busy = false;
      if (opts.onAfterResult) { try { opts.onAfterResult(btn); } catch(e){} }
    } catch(e) {
      status.textContent = "录音失败，请允许麦克风权限后重试";
      resetBtn();
      busy = false;
      recording = false;
      if (opts.showSelfJudge) showSelfJudgeFallback(host, onResult);
    }
  };
}
function showSelfJudgeFallback(host, onResult){
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="blank-card" style="margin-top:16px">录音不可用，可先听示范再自评：</div>
    <div class="type-row" style="margin-top:12px">

      <button class="btn ghost" style="flex:1" id="sjNo">${IC.refresh} 还需再练</button>
    </div>`;
  host.appendChild(wrap);
  const fire = ok => { if (onResult) onResult({ ok, hyp: "", score: ok ? 85 : 55, stars: ok ? 3 : 2, msg: ok ? "真棒！发音很标准！" : "继续加油，再听一次示范！" }); };
  host.querySelector("#sjOk").onclick = () => fire(true);
  host.querySelector("#sjNo").onclick = () => fire(false);
}
function showPracticeScore(item, r){
  const ctx = practiceCtx;
  if (!ctx || ctx.done) return;
  ctx.done = true;
  window.__ppItem = item; window.__ppBack = ctx.onBack || null;
  S.speakLog = S.speakLog || [];
  S.speakLog.push({ en: item.en, score: r.score, t: Date.now() });
  saveState();
  const stars = [1, 2, 3].map(i => `<svg viewBox="0 0 24 24" fill="currentColor" class="${i <= r.stars ? "lit" : ""}"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>`).join("");
  $("#ppStars").innerHTML = stars;
  $("#ppBody").innerHTML = `
    <div class="score-box">
      <div class="score-num">${r.score}<span style="font-size:1.2rem"> 分</span></div>
      <div class="score-t">${esc(r.msg || (r.ok ? "真棒！发音很标准！" : "继续加油，再听一次示范！"))}</div>
      <div class="stars-row">${stars}</div>
      ${r.hyp ? `<div style="font-size:.95rem;color:var(--ink-2);margin-top:10px">我听到：<span class="en" style="font-weight:900">${esc(r.hyp)}</span></div>` : ""}

}

function exportCourse(){
  const lines = [];
  S.course.units.forEach(u => {
    lines.push(u.title);
    u.words.forEach(w => lines.push(w.en + " " + w.zh));
    u.dialogues.forEach(d => {
      lines.push("对话：" + d.title);
      d.lines.forEach(l => lines.push(l.who + ": " + l.en + " " + l.zh));
    });
    lines.push("");
  });
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "RyanEnglish课程.txt";
  document.body.appendChild(a); a.click(); a.remove();
  toast("课程文本已导出");
}

  S.course = { id: "c" + Date.now().toString(36), title: units[0].title.replace(/^unit\s*\d+\s*[:：]?\s*/i, "") ? (units[0].title.replace(/^unit\s*\d+\s*[:：]?\s*/i, "") || "我的课程") : "我的课程", units, source: "自定义导入" };
  saveState();
  go("#/course");
  toast("已载入 " + units.length + " 个单元，共 " + courseStats().total + " 个考点");
}

function setDiff(d){ EXAM.cfg.diff = d; renderExam(); }
function setCount(c){ EXAM.cfg.count = c; renderExam(); }
function diffAllowsKind(diff, kind){
  if (diff === 1) return kind === "word";
  if (diff === 2) return kind === "word" || kind === "phrase";
  return true;
}
function buildQuiz(cfg){
  if (!S.course) return null;
  let items = allItems().filter(it => !it._unitId || cfg.unitIds.includes(it._unitId))
    .filter(it => diffAllowsKind(cfg.diff, it._kind))
    .filter(it => cfg.kinds.includes(it._kind));
  if (!items.length) return null;
  const pool = [];
  const allWords = items.filter(it => it._kind !== "dialogue");
  const allSent = items.filter(it => it._kind === "dialogue");
  items.forEach(it => {
    const isSent = it._kind === "dialogue";
    const wc = (it.en || "").split(" ").length;
    if (cfg.modes.includes("choice")) {
      if (cfg.types.includes("e2c")) pool.push({ it, mode: "choice", type: "e2c" });
      if (cfg.types.includes("c2e")) pool.push({ it, mode: "choice", type: "c2e" });
    }
    if (cfg.modes.includes("speak") && cfg.types.includes("read")) pool.push({ it, mode: "speak", type: "read" });
    if (cfg.modes.includes("type")) {
      if (cfg.types.includes("spell") && (!isSent || wc <= 4)) pool.push({ it, mode: "type", type: "spell" });
      if (cfg.types.includes("fill")) pool.push({ it, mode: "type", type: "fill" });
    }
  });
  if (!pool.length) return null;
  const picked = shuffle(pool).slice(0, cfg.count);
  const questions = picked.map((p, i) => makeQuestion(p.it, p.mode, p.type, i, allWords, allSent));
  return questions;
}
function makeQuestion(item, mode, type, idx, allWords, allSent){
  const q = { item, mode, type, idx, answer: item.en, options: [], gap: null, prompt: "" };
  if (mode === "choice") {
    if (type === "e2c") {
      q.answer = item.zh;
      q.display = { en: item.en, ipa: item.ipa || "", zh: "" };
      const src = item._kind === "dialogue" ? allSent : allWords;
      const seen = new Set([item.zh]);
      const uniq = [];
      for (const x of shuffle(src)) {
        if (!x.zh || x.zh === item.zh || x._id === item._id) continue;
        if (seen.has(x.zh)) continue;
        seen.add(x.zh); uniq.push(x.zh);
        if (uniq.length >= 3) break;
      }
      q.options = shuffle(uniq.concat(item.zh).filter(Boolean));
    } else {
      q.answer = item.en;
      q.display = { en: "", ipa: "", zh: item.zh };
      const src = item._kind === "dialogue" ? allSent : allWords;
      const seen = new Set([normWord(item.en)]);
      const uniq = [];
      for (const x of shuffle(src)) {
        if (!x.en || x._id === item._id) continue;
        const k = normWord(x.en);
        if (!k || seen.has(k)) continue;
        seen.add(k); uniq.push(x.en);
        if (uniq.length >= 3) break;
      }
      q.options = shuffle(uniq.concat(item.en).filter(Boolean));
    }
  } else if (mode === "speak") {
    q.display = { en: item.en, ipa: item.ipa || "", zh: item.zh };
  } else if (type === "fill") {
    q.gap = makeGap(item.en);
    q.display = { en: "", ipa: item.ipa || "", zh: item.zh, gapText: q.gap.text };
    q.prompt = "请补全缺失的部分";
  } else {
    q.display = { en: "", ipa: item.ipa || "", zh: item.zh };
    q.prompt = "根据中文，拼出英文";
  }
  return q;
}
function makeGap(en){
  const words = en.trim().split(/\s+/);
  if (words.length === 1) {
    const w = words[0];
    const vowelIdx = [];
    for (let i = 0; i < w.length; i++) if (/[aeiouAEIOU]/.test(w[i])) vowelIdx.push(i);
    let hide;
    if (w.length <= 3) hide = [0];
    else hide = vowelIdx.length >= 2 ? [vowelIdx[0], vowelIdx[1]] : (w.length >= 5 ? [1, 2] : [0]);
    let out = "";
    for (let i = 0; i < w.length; i++) out += hide.includes(i) ? "_" : w[i];
    return { text: out, answer: w };
  }
  const idx = Math.floor(Math.random() * words.length);
  const out = words.map((w, i) => i === idx ? "______" : w).join(" ");
  return { text: out, answer: en };
}

/* ================= 考试进行 ================= */
function startQuiz(){
  if (!EXAM) EXAM = { cfg: defaultExamCfg() };
  const qs = buildQuiz(EXAM.cfg);
  if (!qs) { toast("当前筛选没有可出的题，请放宽条件"); return; }
  EXAM.questions = qs; EXAM.idx = 0; EXAM.correct = 0; EXAM.results = []; EXAM.answered = false; EXAM.done = false;
  EXAM.startTime = Date.now();
  stopAsr();
  $("#tabbar").classList.add("hidden");
  renderQuiz();
}
function renderQuiz(){

  } else if (q.type === "fill") {

        <div class="hint">${esc(q.prompt)}</div>
        <div class="type-box">
          <input class="type-input" id="qIn" placeholder="输入完整答案" autocomplete="off" autocapitalize="off">
        </div>
        <div id="qFb"></div>
        <div class="type-row" style="margin-top:16px">
          <button class="btn green" style="flex:1" id="qSubmit">${IC.check} 提交</button>
        </div>
      </div>`;
  } else {
    body = `
      <div class="q-card" style="text-align:center">
        <div class="big-zh">${esc(q.display.zh)}</div>
        <div class="hint">${esc(q.prompt)}</div>
        <div class="type-box">
          <input class="type-input" id="qIn" placeholder="拼出英文" autocomplete="off" autocapitalize="off">
        </div>
        <div id="qFb"></div>
        <div class="type-row" style="margin-top:16px">
          <button class="btn green" style="flex:1" id="qSubmit">${IC.check} 提交</button>

  $("#view").innerHTML = `

        <span class="q-tag ${MODE_META[q.mode] ? MODE_META[q.mode].cls : ""}">${modeL}</span>
        ${typeL ? `<span class="q-tag ${TYPE_META[q.type] ? TYPE_META[q.type].cls : ""}">${typeL}</span>` : ""}
        <span class="q-tag sun">${EXAM.retestOf ? "错题重考" : ((DIFF_META[EXAM.cfg.diff - 1] ? DIFF_META[EXAM.cfg.diff - 1].label : "") + "难度")}</span>

    submitExamAnswer(ok, { given: v });
  };
  sub.onclick = submit;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
}
function fillHtml(gapText){
  return esc(gapText).replace(/_+/g, m => `<span class="gap">${"_".repeat(m.length)}</span>`);
}
function submitChoice(el, i){
  if (EXAM.answered) return;
  const q = EXAM.questions[EXAM.idx];
  const given = el.dataset.o;
  const ok = q.type === "e2c" ? (given === q.answer) : (normWord(given) === normWord(q.answer));
  submitExamAnswer(ok, { given });
}
function retryState(){
  if (!EXAM || !EXAM.questions || EXAM.questions.length === 0) return;
  clearTimeout(EXAM._autoT);
  const last = EXAM.results.pop();
  if (last && last.ok) EXAM.correct = Math.max(0, EXAM.correct - 1);
  EXAM.answered = false;
}
function addRetryBtn(btn){
  const row = btn.parentNode;
  if (!row || row.querySelector("#qRetryBtn")) return;
  const rb = document.createElement("button");
  rb.id = "qRetryBtn";
  rb.className = "btn ghost sm";
  rb.innerHTML = `${IC.refresh} 再试一次`;
  rb.onclick = () => { stopRecord(); stopAsr(); retryState(); renderQuiz(); };
  row.appendChild(rb);
}
function submitExamAnswer(ok, extra){
  if (EXAM.answered) return;
  EXAM.answered = true;
  const q = EXAM.questions[EXAM.idx];
  recordResult(q.item, ok);
  if (ok) EXAM.correct++;
  EXAM.results.push({ q, ok, extra });
  const fb = $("#qFb");
  if (fb) {
    if (q.mode === "speak") {
      const sc = (extra && extra.score) || 0;
      const ss = [1, 2, 3].map(i => `<svg viewBox="0 0 24 24" fill="currentColor" class="${i <= ((extra && extra.stars) || 1) ? "lit" : ""}"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>`).join("");
      const heard = (extra && extra.hyp) ? `<div style="font-size:.95rem;color:var(--ink-2);margin-top:10px">我听到：<span class="en" style="font-weight:900">${esc(extra.hyp)}</span></div>` : "";
      const nextLbl = (EXAM.idx + 1 < EXAM.questions.length) ? "下一题" : "查看成绩";
      fb.innerHTML = ok ? `
        <div class="fb-banner ok"><div class="fb-ic">${IC.check}</div><div>发音得分 ${sc} 分，读得很标准！</div></div>
        <div class="score-box" style="margin-top:12px"><div class="score-num">${sc}<span style="font-size:1.2rem"> 分</span></div><div class="stars-row">${ss}</div>${heard}
        <button class="btn green" id="qNextBtn" style="margin-top:16px;width:100%">${nextLbl} ${IC.play}</button></div>` :
        `<div class="fb-banner bad"><div class="fb-ic">${IC.x}</div><div>再听一次示范，慢一点读：<span class="en">${esc(q.item.en)}</span></div>${heard}
        <button class="btn green" id="qNextBtn" style="margin-top:16px;width:100%">${nextLbl} ${IC.play}</button></div>`;
    } else {
      fb.innerHTML = ok
        ? `<div class="fb-banner ok"><div class="fb-ic">${IC.check}</div><div>答对了！</div></div>`
        : `<div class="fb-banner bad"><div class="fb-ic">${IC.x}</div><div>正确答案是：<span class="en" style="font-weight:900">${esc(q.answer)}</span></div></div>`;
    }
  }
  const opts = $$("#opts .opt-btn");
  if (opts.length) opts.forEach(b => {
    const isA = q.type === "e2c" ? (b.dataset.o === q.answer) : (normWord(b.dataset.o) === normWord(q.answer));
    if (isA) b.classList.add("ok"); else b.classList.add("dim");
  });
  const inp = $("#qIn");

    if (ok) inp.classList.add("correct"); else inp.classList.add("wrong");
    inp.disabled = true;
  }

  // 口说题：点击"下一题"后进入；其余题型自动进入下一题

      else finishQuiz();

  } else {
    EXAM._autoT = setTimeout(() => {

      else finishQuiz();
    }, 1500);
  }
}
function quizNext(){
  if (!EXAM.answered) return;
  EXAM.idx++; EXAM.answered = false;
  renderQuiz();
}
function quitQuiz(){
  stopAsr();
  clearTimeout(EXAM._autoT);
  confirmModal("确定要退出考试吗？", "本次考试成绩不会保留。", "退出考试", () => {
    EXAM = null;
    $("#tabbar").classList.remove("hidden");
    render(); go("#/exam");
  });
}
function finishQuiz(){
  stopAsr();
  const total = EXAM.questions.length;
  const correct = EXAM.correct;
  const score = Math.round(correct / total * 100);
  const stars = score >= 90 ? 3 : score >= 70 ? 2 : 1;
  const wrong = EXAM.results.filter(r => !r.ok);
  // 记录考试记录
  const durSec = EXAM.startTime ? Math.round((Date.now() - EXAM.startTime) / 1000) : 0;
  S.examLog = S.examLog || [];
  S.examLog.unshift({ t: Date.now(), dur: durSec, total, correct, wrong: total - correct, rate: score });
  if (S.examLog.length > 60) S.examLog.length = 60;
  saveState();
  EXAM.done = true;
  const rows = EXAM.results.map(r => {
    const q = r.q;
    const label = (r.q.mode === "speak" ? "口说" : r.q.type === "e2c" ? "英翻中" : r.q.type === "c2e" ? "中翻英" : r.q.type === "fill" ? "填空" : "拼写") + " · " + (q.item._kind === "dialogue" ? "对话" : q.item._kind === "phrase" ? "短语" : "单字");
    return `<div class="result-row">
      <div class="ok-ic" style="color:${r.ok ? "var(--green)" : "var(--coral)"}">${r.ok ? IC.check : IC.x}</div>
      <div style="flex:1;min-width:0"><span class="en" style="font-weight:900">${esc(q.item.en)}</span> <span style="color:var(--ink-2);font-size:.9rem">${esc(q.item.zh || "")}</span></div>
      <span class="tip">${label}</span>
    </div>`;
  }).join("");
  $("#view").innerHTML = `
    <div class="quiz-shell">
      <div class="quiz-head">
        <button class="icon-btn" onclick="closeResult()">${IC.close}</button>
        <div style="font-weight:900;font-size:1.2rem">考试完成</div>
        <div class="q-stars">${[1, 2, 3].map(i => `<svg viewBox="0 0 24 24" fill="currentColor" class="${i <= stars ? "lit" : ""}"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>`).join("")}</div>
      </div>
      <div class="q-card">
        <div class="result-score">${score}<span style="font-size:1.8rem"> 分</span></div>
        <div class="result-sub">${stars === 3 ? "太棒了，你是英语小达人！" : stars === 2 ? "很不错，继续加油！" : "别灰心，多练几遍就厉害了！"}</div>
        <div class="result-grid">
          <div class="result-cell"><div class="rc-n">${total}</div><div class="rc-l">总题数</div></div>
          <div class="result-cell"><div class="rc-n" style="color:var(--green)">${correct}</div><div class="rc-l">答对</div></div>
          <div class="result-cell"><div class="rc-n" style="color:var(--coral)">${total - correct}</div><div class="rc-l">答错</div></div>
        </div>
        ${wrong.length ? `<div class="fb-banner bad" style="margin-bottom:14px"><div class="fb-ic">${IC.heart}</div><div>${wrong.length} 道错题已自动加入错题本，连对 3 次才算掌握</div></div>` : `<div class="fb-banner ok" style="margin-bottom:14px"><div class="fb-ic">${IC.trophy}</div><div>全部答对，没有错题！</div></div>`}
        <div class="type-row">
          <button class="btn green" style="flex:1" onclick="retryQuiz()">${IC.refresh} 再考一次</button>
          ${wrong.length ? `<button class="btn coral" style="flex:1" onclick="closeResult();go('#/wrong')">${IC.heart} 去错题本</button>` : `<button class="btn ghost" style="flex:1" onclick="closeResult();go('#/home')">${IC.home} 回首页</button>`}
        </div>
        <div class="card-title" style="margin-top:20px">${IC.book} 逐题回顾</div>
        ${rows}
      </div>
    </div>`;
}
function retryQuiz(){
  clearTimeout(EXAM._autoT);
  EXAM.done = false;
  if (EXAM.retestOf === "all") return retestAllWrong();
  if (EXAM.retestOf) { const id = EXAM.retestOf; EXAM.done = false; return quickRetest(id); }
  EXAM.idx = 0; EXAM.correct = 0; EXAM.results = []; EXAM.answered = false;
  startQuiz();
}
function closeResult(){
  stopAsr();
  clearTimeout(EXAM._autoT);
  EXAM = null;
  $("#tabbar").classList.remove("hidden");
  render(); go("#/exam");
}
function showExamLog(){
  const list = S.examLog || [];
  const fmtT = ts => {
    const d = new Date(ts);
    const p = n => String(n).padStart(2, "0");
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + p(d.getHours()) + ":" + p(d.getMinutes());
  };
  const fmtDur = s => (s >= 60 ? Math.floor(s / 60) + "分" + (s % 60) + "秒" : s + "秒");
  const rows = list.length ? list.map((r, i) => `
    <div class="result-row">
      <div class="ok-ic" style="color:${r.rate >= 70 ? "var(--green)" : "var(--coral)"}">${r.rate >= 70 ? IC.check : IC.flag}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:900">第 ${list.length - i} 次 · ${fmtT(r.t)}</div>
        <div style="font-size:.88rem;color:var(--ink-2)">用时 ${fmtDur(r.dur)} · 共 ${r.total} 题</div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:900;color:var(--green-d)">${r.rate}%</div>
        <div style="font-size:.85rem;color:var(--ink-2)">对 ${r.correct} / 错 ${r.wrong}</div>
      </div>
    </div>`).join("") : "";
  confirmModal("考试记录", `
    ${list.length ? `<div style="max-height:46vh;overflow-y:auto">${rows}</div>
    <div style="margin-top:12px;text-align:center;color:var(--ink-2);font-size:.9rem">共 ${list.length} 次考试 · 记录保存在本机</div>`
    : `<div class="empty" style="padding:16px"><div class="e-d">还没有考试记录，完成一次考试后会自动记录用时、对错与正确率</div></div>`}
  `, "好的", () => {});
}

/* ================= 错题本 ================= */
function renderWrong(){
  const ws = wrongItems();
  const g = wrongGroups();
  const active = g.active, near = g.near, mastered = g.mastered;
  const itemRow = it => {
    const m = getMastery(it._id);
    const st = m.status === "mastered" ? "已掌握" : (m.consecutive >= 2 ? "连对 " + m.consecutive + " 次" : "待攻克");
    return `<div class="wb-item">
      <div class="wb-en en">${esc(it.en)}</div>
      ${it.ipa ? `<div class="wb-ipa">${ipaVowelHtml(it.ipa)}</div>` : ""}
      <div class="wb-zh">${esc(it.zh || "（中文待补充）")}</div>
      <div class="wb-meta">${it._kind === "dialogue" ? "对话" : it._kind === "phrase" ? "短语" : "单字"} · ${st}</div>
      <div class="w-acts">
        <button class="mini-btn" title="听发音" data-t="${esc(it.en)}" onclick="speakEn(this.dataset.t)">${IC.sound}</button>
        <button class="mini-btn coral" title="再练一次" onclick="quickRetest('${it._id}')">${IC.refresh}</button>
        ${m.status === "mastered" ? `<button class="mini-btn" style="background:var(--coral-bg);color:var(--coral-d)" title="移除记录" onclick="removeWrong('${it._id}')">${IC.trash}</button>` : ""}
      </div>
    </div>`;
  };
  const grp = (list, title, cls, key) => list.length ? `
    <div class="card" id="grp-${key}" style="margin-top:16px">
      <div class="card-title" style="color:${cls === "green" ? "var(--green-d)" : cls === "coral" ? "var(--coral-d)" : "#8A5B00"}">${IC.heart} ${title}（${list.length}）</div>
      ${list.map(itemRow).join("")}
    </div>` : "";
  $("#view").innerHTML = `
    <div class="view-head"><div class="view-title">错题记录</div><div class="view-sub">反复考核，连续答对 3 次才算真正掌握</div></div>
    <div class="wb-groups">
      <div class="wb-g coral" onclick="scrollToGroup('grp-active')"><div class="wb-n">${active.length}</div><div class="wb-l">待攻克</div></div>
      <div class="wb-g sun" onclick="scrollToGroup('grp-near')"><div class="wb-n">${near.length}</div><div class="wb-l">接近掌握</div></div>
      <div class="wb-g green" onclick="scrollToGroup('grp-mastered')"><div class="wb-n">${mastered.length}</div><div class="wb-l">已攻克</div></div>
    </div>
    <div class="type-row" style="gap:10px">
      <button class="btn coral" style="flex:1" onclick="retestAllWrong()" ${active.length ? "" : "disabled"}>${IC.refresh} 重考错题</button>
      <button class="btn blue" style="flex:1" onclick="openOcrPanel()">${IC.camera} 拍照错题</button>
      <button class="btn sun" onclick="openAddWrong()">${IC.pencil} 手动添加</button>
    </div>
    ${active.length === 0 && mastered.length === 0 ? `<div class="card empty" style="margin-top:16px"><div class="e-ic">${IC.heart}</div><div class="e-t">没有错题，真棒！</div><div class="e-d">考试中的错题会自动记在这里；也可以拍照或手动添加。</div><button class="btn green" onclick="go('#/exam')">${IC.flag} 去考试</button></div>` : ""}
    ${grp(near, "接近掌握（再对 1 次就掌握啦）", "sun", "near")}
    ${grp(active, "待攻克", "coral", "active")}
    ${grp(mastered, "已攻克（连对 3 次）", "green", "mastered")}`;
}
function scrollToGroup(id){
  const el = document.getElementById(id);
  if (!el) { toast("这一组暂时还没有错题"); return; }
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}
function removeWrong(id){
  confirmModal("确定要删除这条错题记录吗？", () => {
    delete S.mastery[id];
    S.extras = (S.extras || []).filter(e => e._id !== id);
    saveState();
    renderWrong();
    toast("已移除记录");
  });
}
function quickRetest(id){
  const item = allItems().find(x => x._id === id);
  if (!item) { toast("未找到该考点"); return; }
  const all = allItems();
  const allWords = all.filter(x => x._kind !== "dialogue");
  const allSent = all.filter(x => x._kind === "dialogue");
  const q = makeQuestion(item, "choice", "e2c", 0, allWords, allSent);
  EXAM = { cfg: defaultExamCfg(), questions: [q], idx: 0, correct: 0, results: [], answered: false, done: false, retestOf: id };
  $("#tabbar").classList.add("hidden");
  renderQuiz();
}
function retestAllWrong(){
  const items = wrongGroups().active;
  if (!items.length) { toast("没有待攻克的错题"); return; }
  const all = allItems();
  const allWords = all.filter(x => x._kind !== "dialogue");
  const allSent = all.filter(x => x._kind === "dialogue");
  const qs = items.map((it, i) => {
    const t = (i % 2 === 0) ? "e2c" : (i % 3 === 0 ? "spell" : "c2e");
    const mode = t === "spell" ? "type" : "choice";
    return makeQuestion(it, mode, t, i, allWords, allSent);
  });
  EXAM = { cfg: defaultExamCfg(), questions: qs, idx: 0, correct: 0, results: [], answered: false, done: false, retestOf: "all" };
  $("#tabbar").classList.add("hidden");
  renderQuiz();
}
function openAddWrong(){
  const m = confirmModal("手动添加错题", `
    <input id="awEn" class="type-input" style="margin-top:8px" placeholder="英文，如：banana" autocomplete="off" autocapitalize="off">
    <input id="awZh" class="type-input" style="margin-top:10px" placeholder="中文意思，如：香蕉" autocomplete="off">
  `, "加入错题本", () => {
    const en = ($("#awEn") ? $("#awEn").value : "").trim();
    const zh = ($("#awZh") ? $("#awZh").value : "").trim();
    if (!en) { toast("请输入英文"); return false; }
    const it = { en, zh, ipa: autoIpa(en), phrase: en.includes(" ") ? true : false, _id: "x" + uid("x"), _unitId: null, _unitTitle: "拍照/手记错题", _kind: en.includes(" ") ? "phrase" : "word" };
    S.extras = S.extras || [];
    S.extras.push(it);
    S.mastery[it._id] = { consecutive: 0, wrongCount: 1, status: "learning", lastWrongAt: Date.now(), history: [{ ok: false, t: Date.now() }] };
    saveState();
    renderWrong();
    toast("已加入错题本");
  });
}
function confirmModal(title, bodyHtml, okText, onOk){
  const mask = document.createElement("div");
  mask.className = "modal-mask";
  mask.innerHTML = `
    <div class="modal">
      <h3>${esc(title)}</h3>
      ${typeof bodyHtml === "string" ? bodyHtml : `<p>${esc(bodyHtml)}</p>`}
      <div class="m-row">
        <button class="btn ghost" id="cmCancel">取消</button>
        <button class="btn green" id="cmOk">${esc(okText || "确定")}</button>
      </div>
    </div>`;
  document.body.appendChild(mask);
  const close = () => mask.remove();
  mask.addEventListener("click", e => { if (e.target === mask) close(); });
  $("#cmCancel").onclick = close;
  $("#cmOk").onclick = () => {
    if (onOk) {
      const r = onOk();
      if (r === false) return;
    }
    close();
  };
  return { el: mask, close };
}

/* ================= 拍照错题 + OCR ================= */
let ocrState = { worker: null, loaded: false, words: [] };
function loadTesseract(){
  return new Promise((res, rej) => {
    if (window.Tesseract) return res(window.Tesseract);
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = () => res(window.Tesseract);
    s.onerror = () => rej(new Error("OCR 引擎加载失败，请检查网络"));
    document.head.appendChild(s);
  });
}
function openOcrPanel(){
  stopAsr();
  const m = confirmModal("拍照错题 · OCR 识别", `
    <div class="upload-zone" id="ocrZone">${IC.camera}
      <div class="uz-t">拍照或选择错题图片</div>
      <div class="uz-d">拍下孩子的错题（单词/短语/句子），自动识别加入错题本</div>
      <input type="file" id="ocrFile" accept="image/*" capture="environment" style="display:none">
    </div>
    <img class="ocr-img hidden" id="ocrImg">
    <div class="ocr-status" id="ocrStatus"></div>
    <div id="ocrResult" class="hidden">
      <textarea id="ocrText" rows="4" style="width:100%;border:3px solid var(--line);border-radius:14px;padding:12px;font-size:1rem;outline:none"></textarea>
      <div style="font-size:.9rem;font-weight:800;color:var(--ink-2);margin:10px 0 6px">识别出的英文（点选加入错题本）</div>
      <div class="ocr-words" id="ocrWords"></div>
      <button class="btn coral block" id="ocrAdd">${IC.heart} 加入错题本</button>
    </div>
  `, "完成", () => {});
  $("#ocrZone").addEventListener("click", () => $("#ocrFile").click());
  $("#ocrFile").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const img = $("#ocrImg");
    img.src = url; img.classList.remove("hidden");
    $("#ocrStatus").textContent = "图片已选择，点击下方「开始识别」";
    $("#ocrResult").classList.add("hidden");
    ocrState.words = [];
    $("#cmOk").textContent = "开始识别";
    $("#cmOk").onclick = () => { runOcr(f); };
  });
  // 默认状态：没有选图时“完成”直接关闭
}
function runOcr(file){
  const status = $("#ocrStatus");
  status.textContent = "正在加载识别引擎（首次约需几秒）…";
  loadTesseract().then(async T => {
    status.textContent = "正在识别图片文字…";
    let worker;
    try {
      worker = await T.createWorker("eng", 1, {
        logger: m => { if (m.status === "recognizing text") status.textContent = "识别中… " + Math.round(m.progress * 100) + "%"; }
      });
    } catch(e) {
      worker = await T.createWorker("eng");
    }
    const { data } = await worker.recognize(file);
    await worker.terminate();
    const text = (data.text || "").trim();
    $("#ocrText").value = text;
    const words = (text.match(/[A-Za-z][A-Za-z'’-]{1,22}/g) || [])
      .map(w => w.replace(/[^A-Za-z'’]/g, ""))
      .filter(w => w.length > 1 && !["the", "and", "you", "for", "with"].includes(normWord(w)))
      .reduce((acc, w) => { const k = normWord(w); if (!acc.some(x => normWord(x) === k)) acc.push(w); return acc; }, [])
      .slice(0, 24);
    ocrState.words = words;
    status.textContent = words.length ? "识别到 " + words.length + " 个英文词，点选要加入的" : "没有识别到英文单词，请直接编辑下方文本";
    $("#ocrResult").classList.remove("hidden");
    renderOcrWords();
    $("#cmOk").textContent = "完成";
    $("#cmOk").onclick = () => m.close();
  }).catch(err => {
    status.textContent = err.message || "识别失败，请重试";
  });
}
function renderOcrWords(){
  const box = $("#ocrWords");
  if (!box) return;
  const on = ocrState._sel || [];
  box.innerHTML = ocrState.words.map((w, i) => `
    <button class="ocr-word ${on.includes(i) ? "on" : ""}" data-i="${i}"><span class="ck">${on.includes(i) ? IC.check : ""}</span><span class="en">${esc(w)}</span></button>`).join("");
  $$(".ocr-word", box).forEach(b => b.onclick = () => {
    const i = Number(b.dataset.i);
    ocrState._sel = ocrState._sel || [];
    ocrState._sel = ocrState._sel.includes(i) ? ocrState._sel.filter(x => x !== i) : ocrState._sel.concat(i);
    renderOcrWords();
  });
  const addBtn = $("#ocrAdd");
  if (addBtn) addBtn.onclick = () => {
    const sel = (ocrState._sel || []).map(i => ocrState.words[i]);
    const manual = ($("#ocrText").value || "").match(/[A-Za-z][A-Za-z'’ -]{1,30}/g) || [];
    const list = sel.length ? sel : manual.slice(0, 10).map(w => w.trim()).filter(Boolean);
    if (!list.length) { toast("请先点选要加入的单词"); return; }
    let n = 0;
    list.forEach(en => {
      const k = normWord(en);
      if (!k) return;
      const dup = allItems().some(x => normWord(x.en) === k);
      if (dup) return;
      const it = { en: k, zh: "", ipa: autoIpa(k), phrase: k.includes(" ") ? true : false, _id: "x" + uid("x"), _unitId: null, _unitTitle: "拍照/手记错题", _kind: k.includes(" ") ? "phrase" : "word" };
      S.extras = S.extras || [];
      S.extras.push(it);
      S.mastery[it._id] = { consecutive: 0, wrongCount: 1, status: "learning", lastWrongAt: Date.now(), history: [{ ok: false, t: Date.now() }] };
      n++;
    });
    saveState();
    m.close();
    renderWrong();
    toast("已加入 " + n + " 道错题，可随时再次考核");
  };
}

/* ================= 路由与初始化 ================= */
function go(h){
  if (location.hash === h) render();
  else location.hash = h;
}
function render(){
  const h = location.hash || "#/home";
  const tabs = $$(".tab");
  tabs.forEach(t => t.classList.toggle("on", t.dataset.route === h || (h.startsWith("#/unit") && t.dataset.route === "#/course")));
  const wb = wrongItems().filter(it => getMastery(it._id).status !== "mastered").length;
  const badge = $("#wbBadge");
  if (badge) { badge.textContent = wb; badge.classList.toggle("hidden", wb === 0); }
  const ts = $("#topStars");
  if (ts) ts.textContent = S.stars;
  if (h === "#/home") return renderHome();
  if (h === "#/course") return renderCourse();
  if (h === "#/exam") return renderExam();
  if (h === "#/wrong") return renderWrong();
  if (h === "#/import") return renderImport();
  if (h === "#/settings") return renderSettings();
  if (h === "#/about") return renderAbout();
  if (h.startsWith("#/unit/")) return renderUnit(h.slice(7));
  renderHome();
}
function toast(msg){
  let t = $("#toastEl");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.id = "toastEl"; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toast._tm);
  toast._tm = setTimeout(() => { t.style.display = "none"; }, 2200);
}
function init(){
  loadState();
  if (!S.course) {
    const units = parseCourseText(TEXTBOOK_TXT, "");
    S.course = {
      id: "c" + Date.now().toString(36),
      title: "外研版（三起点）三年级上册",
      units,
      source: "内置示例课本"
    };
    saveState();
  }
  $("#btnSettings").addEventListener("click", () => go("#/settings"));
  $$(".tab").forEach(t => t.addEventListener("click", () => go(t.dataset.route)));
  window.addEventListener("hashchange", render);
  if (location.hash && location.hash !== "#/home") render();
  else { location.hash = "#/home"; render(); }
  toast("欢迎回来，Ryan English 搭子已就位");
}
window.addEventListener("DOMContentLoaded", init);
</script>
